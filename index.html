  <style>
    :root{
      --ink: #0a0c0f;
      --ink-2: #12151a;
      --panel: #1d2127;
      --panel-edge: #2a2f37;
      --well: #0e1013;
      --brass: #c9a24b;
      --brass-light: #f0d488;
      --brass-dark: #8a6f2a;
      --cream: #f2ede1;
      --muted: #838c98;
      --danger: #e08585;
    }

    *{
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body{
      height: 100%;
      margin: 0;
      overscroll-behavior: none;
    }

    body{
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;

      background:
        radial-gradient(
          ellipse 900px 500px at 50% -10%,
          rgba(201,162,75,0.10),
          transparent 60%
        ),
        radial-gradient(
          ellipse 700px 500px at 90% 110%,
          rgba(201,162,75,0.06),
          transparent 60%
        ),
        linear-gradient(
          180deg,
          var(--ink),
          var(--ink-2)
        );

      color: var(--cream);

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));
    }

    .stage{
      width: 100%;
      max-width: 440px;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 28px;
    }

    .heading{
      text-align: center;

      display: flex;
      flex-direction: column;

      gap: 4px;
    }

    .heading h1{
      margin: 0;

      font-size: 21px;
      font-weight: 800;

      letter-spacing: 0.2px;

      color: var(--cream);
    }

    .heading p{
      margin: 0;

      font-size: 13.5px;

      color: var(--muted);

      line-height: 1.5;
    }

    /* ---------- Machine ---------- */

    .machine{
      width: 100%;

      background:
        linear-gradient(
          180deg,
          var(--panel),
          #171a1f
        );

      border: 1px solid var(--panel-edge);

      border-radius: 22px;

      padding: 22px 16px 26px;

      box-shadow:
        0 20px 50px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);

      position: relative;
    }

    .machine::before{
      content: "";

      position: absolute;

      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;

      border: 1px solid rgba(255,255,255,0.03);

      border-radius: 16px;

      pointer-events: none;
    }

    .reel-well{
      background: var(--well);

      border-radius: 14px;

      padding: 14px 10px;

      box-shadow:
        inset 0 3px 10px rgba(0,0,0,0.6),
        inset 0 -2px 6px rgba(0,0,0,0.4);

      display: flex;
      justify-content: center;
    }

    .reel-row{
      direction: ltr;

      display: flex;
      align-items: center;

      gap: 4px;
    }

    .reel-gap{
      width: 8px;
    }

    .reel{
      width: 34px;
      height: 54px;

      background:
        linear-gradient(
          180deg,
          #17191d,
          #0c0d10
        );

      border-radius: 5px;

      overflow: hidden;

      position: relative;

      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        inset 0 1px 3px rgba(0,0,0,0.7);
    }

    .reel::after{
      content: "";

      position: absolute;

      left: 0;
      right: 0;

      top: 50%;

      height: 1px;

      background: rgba(0,0,0,0.55);

      box-shadow:
        0 1px 0 rgba(255,255,255,0.04);

      z-index: 2;
    }

    .reel::before{
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.45),
          transparent 25%,
          transparent 75%,
          rgba(0,0,0,0.45)
        );

      z-index: 2;

      pointer-events: none;
    }

    .reel-strip{
      display: flex;
      flex-direction: column;

      will-change: transform;
    }

    .reel-digit{
      height: 54px;

      display: flex;
      align-items: center;

      font-family: 'Space Mono', monospace;

      font-size: 30px;
      font-weight: 700;

      color: var(--cream);

      font-variant-numeric: tabular-nums;
    }

    .reel.spinning .reel-digit{
      filter: blur(1.5px);
    }

    .placeholder-row{
      direction: ltr;

      font-family: 'Space Mono', monospace;

      font-size: 26px;

      letter-spacing: 6px;

      color: #454c56;

      transform: translateY(4px);

      transition:
        opacity 0.35s ease,

    .readout.show{
      opacity: 1;
      transform: translateY(0);
    }

    .readout b{
      color: var(--brass-light);
      font-weight: 700;
    }

    /* ---------- Controls ---------- */

    .controls{

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 18px;
    }

    .field{
      width: 100%;

      display: flex;
      flex-direction: column;

      gap: 7px;
    }

    .field label{
      font-size: 13px;

      color: var(--muted);

      padding: 0 2px;
    }

    .field input{
      width: 100%;

      padding: 15px 16px;

      font-size: 18px;
      font-weight: 600;

      text-align: center;

      border-radius: 13px;

      border: 1px solid var(--panel-edge);

      background: var(--panel);

      color: var(--cream);

      outline: none;

      direction: ltr;

      font-family: 'Space Mono', monospace;

      transition: border-color 0.2s ease;
    }

    .field input:focus{
      border-color: var(--brass);
    }

    .field input::placeholder{

    .lever-btn{

    .lever-track{
      position: absolute;

      top: 0;

      transform: translateX(-50%);

    .lever-knob{
      position: absolute;

      left: 50%;
      top: 0;

      width: 50px;
      height: 50px;

      border-radius: 50%;

      transform: translate(-50%, 0);

      background:
        radial-gradient(
          circle at 32% 28%,
          var(--brass-light),
          var(--brass) 55%,

      box-shadow:
        0 6px 14px rgba(0,0,0,0.55),
        inset 0 1px 2px rgba(255,255,255,0.5),
        inset 0 -3px 6px rgba(0,0,0,0.35);

      transition:
        top 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lever-btn.pulled .lever-knob{
      top: 50px;

      transition:
        top 0.14s cubic-bezier(0.5, 0, 1, 0.4);
    }

    .lever-label{
      font-size: 13px;

      font-weight: 700;

      color: var(--brass-light);

      letter-spacing: 0.3px;
    }

    .hint{
      font-size: 12px;

      color: var(--muted);

      opacity: 0.65;

      text-align: center;
    }

    @media (prefers-reduced-motion: reduce){

      .reel-strip{
        transition: none !important;
      }

      .lever-knob{
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="stage">

    <div class="heading">
      <h1>מי אחד עד</h1>
      <p>בחר מספר מי אחד עד ומשוך לתוצאה</p>
    </div>

    <div class="machine">

      <div class="reel-well">

        <div class="reel-row" id="reelRow">

          <div class="placeholder-row" id="placeholderRow">
            - - - - -
          </div>

        </div>

      </div>

      <div class="readout" id="readout">
        התוצאה:
        <b id="readoutNumber"></b>
      </div>

    </div>

    <div class="controls">

      <div class="field">

        <label for="maxInput">
          טווח: מ-1 עד
        </label>

        <input
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          id="maxInput"
          placeholder="לדוגמה: 1000000"
          maxlength="7"
          autocomplete="off"
        >

      </div>

      <div class="error" id="errorMsg"></div>

      <button
        class="lever-btn"
        id="leverBtn"
        aria-label="משוך כדי להגריל מספר"
        type="button"
      >

        <div class="lever-assembly">

          <div class="lever-track"></div>

          <div class="lever-knob"></div>

        </div>

        <span class="lever-label">
          משוך
        </span>

      </button>

    </div>

    <div class="hint">
      מספר מקסימלי: 1,000,000
    </div>

  </div>

  <script>
    (function(){

      const maxInput = document.getElementById('maxInput');
      const leverBtn = document.getElementById('leverBtn');
      const reelRow = document.getElementById('reelRow');
      const placeholderRow = document.getElementById('placeholderRow');

      const errorMsg = document.getElementById('errorMsg');
      const readout = document.getElementById('readout');
      const readoutNumber = document.getElementById('readoutNumber');

      let spinning = false;

      const reducedMotion =
        window.matchMedia(
          '(prefers-reduced-motion: reduce)'
        ).matches;

      /* ---------- Input ---------- */

      maxInput.addEventListener('input', () => {

        maxInput.value =
          maxInput.value.replace(/[^0-9]/g, '');

      });

      maxInput.addEventListener('keydown', (e) => {

        if(e.key === 'Enter'){

          maxInput.blur();

          pull();

        }

      });

      leverBtn.addEventListener('click', pull);

      /* ---------- Pull ---------- */

      function pull(){

        if(spinning){
          return;
        }

        errorMsg.textContent = '';

        const raw = maxInput.value.trim();

        if(raw === ''){

          errorMsg.textContent =
            'נא להזין מספר עליון לטווח';

          return;
        }

        const max = parseInt(raw, 10);

        if(Number.isNaN(max) || max < 1){

          errorMsg.textContent =
            'נא להזין מספר גדול מ-0';

          return;
        }

        if(max > 1000000){

          errorMsg.textContent =
            'המספר המקסימלי הוא 1,000,000';

          return;
        }

        const result =
          Math.floor(Math.random() * max) + 1;

        const digitCount =
          String(max).length;

        const digits =
          String(result)
            .padStart(digitCount, '0')
            .split('');

        spinAnimation(digits, result);
      }

      /* ---------- Animation ---------- */

      function spinAnimation(digits, result){

        spinning = true;

        leverBtn.disabled = true;

        leverBtn.classList.add('pulled');

        readout.classList.remove('show');

        setTimeout(() => {

          leverBtn.classList.remove('pulled');

        }, 160);

        if(placeholderRow.parentNode){

          placeholderRow.remove();

        }

        reelRow.innerHTML = '';

        const n = digits.length;

        const reelEls = [];

        const baseDuration = 950;

        const stepDuration = 190;

        digits.forEach((digit, i) => {

          /* מפריד אלפים */

          const fromRight =
            n - 1 - i;

          if(
            i !== 0 &&
            fromRight % 3 === 2
          ){

            const gap =
              document.createElement('div');

            gap.className =
              'reel-gap';

            reelRow.appendChild(gap);

          }

          const reel =
            document.createElement('div');

          reel.className =
            'reel spinning';

          const strip =
            document.createElement('div');

          strip.className =
            'reel-strip';

          const loops =
            3 + (i % 3);

          for(let l = 0; l < loops; l++){

            for(let d = 0; d < 10; d++){

              const cell =
                document.createElement('div');

              cell.className =
                'reel-digit';

              cell.textContent = d;

              strip.appendChild(cell);

            }

          }

          const finalCell =
            document.createElement('div');

          finalCell.className =
            'reel-digit';

          finalCell.textContent =
            digit;

          strip.appendChild(finalCell);

          reel.appendChild(strip);

          reelRow.appendChild(reel);

          reelEls.push({

            reel,
            strip,

            duration:
              baseDuration + i * stepDuration,

            totalItems:
              loops * 10 + 1

          });

        });

        /* Reflow */

        void reelRow.offsetHeight;

        const itemHeight =
          reelEls[0]
            .strip
            .firstElementChild
            .getBoundingClientRect()
            .height;

        let maxDuration = 0;

        reelEls.forEach(
          ({
            strip,
            duration,
            totalItems
          }) => {

            const distance =
              (totalItems - 1) *
              itemHeight;

            const d =
              reducedMotion
                ? 1
                : duration;

            strip.style.transition =
              `transform ${d}ms cubic-bezier(0.12,0.72,0.24,1)`;

            strip.style.transform =
              `translateY(-${distance}px)`;

            maxDuration =
              Math.max(
                maxDuration,
                d
              );

          }
        );

        setTimeout(() => {

          reelEls.forEach(
            ({ reel }) => {

              reel.classList.remove(
                'spinning'
              );

            }
          );

          readoutNumber.textContent =
            result.toLocaleString('en-US');

          readout.classList.add('show');

          spinning = false;

          leverBtn.disabled = false;

        }, maxDuration + 80);

      }

    })();
  </script>

</body>
</html>
